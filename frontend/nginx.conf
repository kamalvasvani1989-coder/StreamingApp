server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: unknown paths go to index.html so refreshing /browse doesn't 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached for a long time
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Lightweight endpoint for Kubernetes liveness/readiness probes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
